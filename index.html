<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>AlgoVisualizer - Interactive Algorithm Engine</title>
</head>
<body>
    <header>
        <h1>Algorithm Visualizer</h1>
        <div class = "controls">
            <button id="generate-btn">Generate New Array</button>
            <div class="slider-group">
                <label for="array-size">Size: <span id="size-val">30</span></label>
                <input type="range" id="array-size" min="5" max="80" value="30">
            </div>
        </div>
    </header>

    <main>
        <div id="visualizer-container"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
